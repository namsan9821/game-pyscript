<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>サイコロ</title>
    <script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
    <script type="mpy">
        import pyscript
        import js
        import random
        def show_dice(event):
            r = random.randint(1,6)
            disp = pyscript.document.getElementById("disp")
            disp.innerText = str(r)
    </script>
</head>

<body style="text-align: center;">
    <div>
        <button mpy-click="show_dice">サイコロを振る</button>
    </div>
    <div id="disp" style="font-size:8em;">-</div>
</body>
